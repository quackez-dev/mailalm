[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mailalm-model = { path = "crates/model" }
mailalm-mime = { path = "crates/mime" }
mailalm-net = { path = "crates/net" }
mailalm-store = { path = "crates/store" }
mailalm-engine = { path = "crates/engine" }
mailalm-antidote = { path = "crates/antidote" }

# Every crate below is at the version, and with the features, MailCraft v0.41.0 uses: audited there
# (audits/mailcraft), and the Cargo.lock is checked against that one (audits/mailalm/README.md).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
# Mail: parsing (mail-parser), writing (mail-builder), HTML to text (html2text).
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
mail-builder = { version = "2", default-features = false }
html2text = { version = "0.17", features = ["css"] }
# Network: IMAP responses (imap-proto), SMTP (lettre), TLS (rustls with ring).
imap-proto = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# SHA-256 and secure random numbers for OAuth's PKCE: the ring rustls already uses.
ring = "0.17"
rustls-native-certs = "0.8"
schannel = "0.1"
# Passwords in the system's keychain (Credential Manager on Windows).
keyring = "4.2"
# Where Antidote is installed (HKLM\SOFTWARE\Druide informatique inc.\Connectix): the version in MailCraft's
# lock (craft-font-catalog, sspi, ipconfig use it); its windows-link, -result, -strings are already in ours.
windows-registry = "0.6.1"
# The user's data folders (%APPDATA%, %LOCALAPPDATA%).
dirs = "7"
# Local times: the system's zone name and its rules.
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
iana-time-zone = "0.1"

# UI: egui 0.37 and winit 0.30 as the Craft apps build them (storytold's forks, see [patch] below).
egui = "0.37"
eframe = { version = "0.37", default-features = false }
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# egui and winit: storytold's forks, at the revisions CraftTools already audited (MailCraft v0.41.0,
# WordCraft, PhotoCraft). The build fetches them from the quackez-dev mirrors, never from storytold.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
