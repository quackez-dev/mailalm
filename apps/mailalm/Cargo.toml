[package]
name = "mailalm"
description = "MailALM desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mailalm-model = { workspace = true }
# The symbol fonts (▾, ✓…) egui had by default before 0.37.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
# Without default features, so each one is named. No persistence, no system fonts, no links.
eframe = { workspace = true, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
log = { workspace = true }
