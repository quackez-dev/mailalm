[package]
name = "mailalm"
description = "MailALM desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mailalm-model = { workspace = true }
mailalm-mime = { workspace = true }
mailalm-store = { workspace = true }
mailalm-engine = { workspace = true }
mailalm-safety = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
# Dates in the computer's time zone: its IANA name (iana-time-zone) and the zone's rules (chrono-tz).
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
# The symbol fonts (📎, ⚑…) egui had by default before 0.37. Neither has ▾ or ✓: those are painted (icons.rs).
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
# Without default features, so each one is named. No persistence, no system fonts, no links.
eframe = { workspace = true, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
log = { workspace = true }
# Attachments (phase 5): the preview the user asks for (pictures, PDF pages), and the file dialogs
# (Attach…, Save as…).
image = { workspace = true }
hayro = { workspace = true }
rfd = { workspace = true }

[build-dependencies]
# Icon, VERSIONINFO and manifest in mailalm.exe (build.rs, Windows only). It runs the Windows SDK's
# resource compiler (rc.exe) and nothing else. The version MailCraft v0.41.0 uses, audited there.
winresource = "0.1"
